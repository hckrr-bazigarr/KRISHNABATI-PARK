<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Pricing | Park Admin</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<main class="section">
    <div class="container">
        <a href="dashboard.html">← Dashboard</a>
        <h1>Ticket Pricing</h1>

        <div class="notice">
            Pricing is not configured. This page is an interface
            placeholder; no ticket prices are assumed.
        </div>

        <div class="form-card">
            <div class="field">
                <label>Adult ticket price (INR)</label>
                <input type="number" min="0" placeholder="Not configured">
            </div>

            <div class="field" style="margin-top:15px">
                <label>Child ticket price (INR)</label>
                <input type="number" min="0" placeholder="Not configured">
            </div>

            <button class="btn" type="button" disabled
                style="margin-top:20px;opacity:.5">
                Save pricing — backend required
            </button>
        </div>
    </div>
</main>

</body>
</html>
